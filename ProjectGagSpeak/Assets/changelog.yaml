          - text: "Fixed issue where removing patterns/restraints with the right click popup menu crashed the game."
          - text: "No longer checks say chat back on in the garbler preferences."
          - text: "Fixed Duration achievements displaying progress in the UI incorrectly."
          - text: "A Note on anyone reporting Mare related Crashes: This occurs due to (what I highly presume to be the case) Mare loading Mods with invalid Vertexs (invalid mods) multiple times in quick succession. You likely already notice these crashes occur when people with broken mods load in for the first time, because on login's and first loads they load twice. The same occurs when mare connects and tries to load someones glamour and their restraint set. GagSpeak does not interact with Mare, they have no association with a reason for crash than any other plugin loading a set at the same time would have."
            isImportant: true

