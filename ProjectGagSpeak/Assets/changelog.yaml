  - version: v1.2.0.0
    date: "2025"
    title: "HIGHLY RECOMMEND YOU SKIM THROUGH THIS"
    headerMessage: "Custom Pair Action Combos are now Live! See the finer details about what you apply to your pairs! A new Timer Padlock has been added, no more hope of guessing the password for you!"
    segments:
      - icon: "Star"
        title: "New Features"
        accent: "Pink"
        bullets:
          - text: "GagType dropdowns lets you see their enabled Gag Glamours, along with the slot and item."
          - text: "Restraint dropdowns lets you preview the outfit and view any Hardcore traits applied when you equip it."
          - text: "Pattern dropdowns lets you see pattern descriptions, if they loop, and how long they run for!"
          - text: "Alarm dropdowns let you see when they go off (scoped to your time zone), and what pattern it sets off."
          - text: "Trigger dropdowns let you see trigger priority, description, its kind, and execution action type."
      - icon: "Wrench"
        title: "Quality of Life"
        accent: "Blue"
        bullets:
          - text: "Padlocks have now had their permission hierarchy restructured. There is now unique permissions for allowing permanent, owner, and devotional type locks, giving you full control over what locks can be applied, and for how long."
            isImportant: true
          - text: "GagStorage now properly waits for you to hit save before updating the data, and will not revert if you click off."
          - text: "LightStorage now also contains a few extra lightweight details about the data on pairs you store."
          - text: "SafewordUsed is no longer in permissions to avoid confusion."
          - text: "Aggressive detection for C+ is now in place, if issues persist, it is likely a customize+ issue."
          - text: "ForcedStay text node filters now use proper syntax for serialization (backend stuff)."
          - text: "Preliminary support for Puppeteer AllowAliasTriggers permission level has been added, logic WIP."
          - text: "Pairs you have not allowed to apply your own moodles to you, will not be able to see your moodles in the wardrobe."
          - text: "Kinkster-### is not Kinkster-####, this can be opt-out in the config settings under preferences."
      - icon: "Bug"
        title: "Bug Fixes"
        accent: "Yellow"
        bullets:
          - text: "Fixed an issue that caused [REDACTED]."
          - text: "Achievement 'Silence of Shame' properly tracks now."

